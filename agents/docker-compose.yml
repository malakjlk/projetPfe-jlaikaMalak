# Redis pour SMAML : espace de travail partagé + cache
#   docker compose up -d
# Sans Redis, SMAML bascule automatiquement sur SQLite.
services:
  redis:
    image: redis:7-alpine
    container_name: smaml-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - smaml-redis:/data
    restart: unless-stopped
volumes:
  smaml-redis: